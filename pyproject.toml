[project]
name = "bufo-gen"
version = "0.1.0"
description = "Agentic bufo video generator: marimo UI + OpenAI Agents SDK + Laya routing + MiniMax-H3 on CoreWeave, traced to Forge Weave."
readme = "README.md"
# Pinned to the cluster's Python; torch/laya don't support newer interpreters yet.
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- app / agents ---
    "marimo>=0.13",
    "openai-agents>=0.2",   # imports as `agents`
    "weave>=0.51",          # Forge Weave tracing (auto-patches openai-agents)
    "laya>=0.1",            # System-1 workflow classifier (convaiinnovations/laya)
    "python-dotenv>=1.0",
    # --- MiniMax-H3 generation stack (mirrors the proven video_gen_demo pins) ---
    "torch>=2.13.0",
    "torchvision>=0.28.0",  # must match torch's CUDA build or Qwen3-VL's processor loads as None
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
    "av>=17.1.0",           # PyAV: encode_video muxes video+audio into one mp4
    "diffusers",            # git main — the MiniMax-H3 modular pipeline isn't in a release yet
    "opencv-python>=4.10",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
]
# NOTE: do NOT add `kernels` (Flash-Attention 3 JIT) — it fails to compile on the
# cluster's compute nodes (no Python dev headers); attention falls back to SDPA.

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bufo_gen"]
